# career-ops-lite — perfil del candidato
#
# Copia este fichero a `config/profile.yml` y rellena los campos.
# Es la ÚNICA fuente de verdad sobre el candidato, junto con `cv.md`.
# El agente lee estos valores en cada evaluación: no los dupliques en otro sitio.

candidate:
  name: "Tu Nombre Completo"
  email: "tu@email.com"
  phone: "+57 300 000 0000"
  location: "Bogotá, Colombia"
  linkedin: "linkedin.com/in/tu-usuario"
  github: "github.com/tu-usuario"   # opcional
  portfolio: ""              # web propia (si es la misma que github, se muestra una vez)
  links: []                  # enlaces extra: [{ label: "Copr", url: "https://…" }]
  stage: ""                  # estudiante | junior | experienced (con experiencia)
  graduation: ""             # fecha esperada, si estudias (ej. "2027-1")
  years_experience: 0        # años de experiencia profesional
  timezone: "America/Bogota"

job_search:
  target_roles:              # cargos que buscas, en orden de preferencia
    - "Analista de Datos"
    - "Data Engineer"
  seniority: ""              # junior | mid | senior | lead | cualquiera
  industries: []             # sectores que te interesan (opcional)
  modality: "remoto"         # remoto | hibrido | presencial | cualquiera
  city: "Bogotá"
  country: "Colombia"
  willing_to_relocate: false
  salary_target: ""          # ej. "8.000.000 - 12.000.000"
  currency: "COP"
  deal_breakers: []          # ej. ["on-call 24/7", "viajar > 1 semana/mes"]

language:
  output: es                 # idioma de las respuestas, informes y CV: es | en | pt

cv:
  max_pages: 1               # career-ops-lite está diseñado para 1 página
  strict_pages: true         # un CV que desborda falla en vez de avisar
  page_format: letter        # letter (Colombia/LATAM) | a4
  mode: auto                 # auto | experienced | entry | mixed (auto se deduce de cv.md)
  max_experiences: 5         # roles como máximo en el CV adaptado
  max_projects: 4            # proyectos como máximo en el CV adaptado
  bullets_per_role: 2        # bullets por rol o proyecto en el CV adaptado
  max_competencies: 8
  max_certifications: 3

scoring:
  apply_threshold: 4.0       # 3.5 si eres estudiante o junior; por debajo no se genera PDF
  below_threshold: ask       # ask | force | discard (ask: ofrece el CV; force: lo genera; discard: descarta)
  min_score: 0               # > 0: si el score queda por debajo, pide confirmación una vez

# Presentación del PDF. Todos los valores son opcionales: sin este bloque se
# usan los del template. Se inyectan como variables CSS en el render.
style:
  accent_color: "#1d4ed8"
  secondary_color: "#111827"
  font_family: "Outfit, Inter, sans-serif"
  font_size: "10pt"
  margin: "0.5in"
